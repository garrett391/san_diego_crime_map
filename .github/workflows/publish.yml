# Rebuilds the dashboard from the city's data every morning and publishes it with GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# News and Reddit items come from chatter/items.jsonl as committed; this job does not fetch them
# (Reddit turns away requests from cloud servers), so refresh those locally and commit the file.
# Police dispatch calls are one of the city's files, so `fetch` brings those in fresh on every run.
name: Publish dashboard

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "30 15 * * *"   # 8:30 am Pacific in summer; the city rewrites its files about 7 am
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node --test tests/js/stats.test.mjs
      - run: python -m pipeline fetch
      - run: python -m pipeline build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
